name: Scoped operator image
on:
  push:
    branches: [codex/secret-watch-scope]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834
        with:
          install_args: helm
      - run: make test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rokoucha/mackerel-operator:secret-scope-${{ github.sha }}
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
